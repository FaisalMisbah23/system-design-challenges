<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>A queue builds behind a single worker</title>
  <defs>
    <circle id="queue-item" r="16" fill="#cbd5e1"/>
    <polygon id="arrowhead" points="0,-6 12,0 0,6"/>
  </defs>

  <rect width="760" height="340" fill="#ffffff"/>
  <rect x="40" y="120" width="380" height="70" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230" y="102" text-anchor="middle" fill="#334155" font-size="14" font-weight="600">queue (requests waiting)</text>

  <use href="#queue-item" x="90" y="155"/>
  <use href="#queue-item" x="150" y="155"/>
  <use href="#queue-item" x="210" y="155"/>
  <use href="#queue-item" x="270" y="155"/>
  <use href="#queue-item" x="330" y="155"/>

  <rect x="374" y="133" width="40" height="44" fill="#ffffff" stroke="#e2e8f0"/>

  <line x1="20" y1="155" x2="40" y2="155" stroke="#64748b" stroke-width="3"/>
  <use href="#arrowhead" x="40" y="155" fill="#64748b"/>
  <text x="20" y="180" text-anchor="middle" fill="#64748b" font-size="13">arrivals</text>

  <line x1="420" y1="155" x2="520" y2="155" stroke="#64748b" stroke-width="2.5"/>
  <use href="#arrowhead" x="520" y="155" fill="#64748b"/>

  <rect x="532" y="120" width="150" height="70" rx="10" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="607" y="152" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">worker</text>
  <text x="607" y="172" text-anchor="middle" fill="#dbeafe" font-size="12">~10 ms busy per request</text>

  <line x1="682" y1="155" x2="740" y2="155" stroke="#94a3b8" stroke-width="2.5"/>
  <use href="#arrowhead" x="740" y="155" fill="#94a3b8"/>
  <text x="716" y="180" text-anchor="middle" fill="#94a3b8" font-size="13">done</text>

  <text x="380" y="300" text-anchor="middle" fill="#64748b" font-size="14">As arrivals push toward the worker's ~100 req/s, the queue grows before every request looks slow.</text>
</svg>
