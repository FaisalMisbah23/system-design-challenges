<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Fan-out turns a 2% dependency into a ~33% page failure</title>
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="180" y="60" text-anchor="middle" fill="#334155" font-size="16" font-weight="700">1 call per page</text>
  <circle cx="120" cy="140" r="34" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="120" y="146" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">1</text>
  <text x="260" y="130" text-anchor="middle" fill="#475569" font-size="13">2% chance a call is slow</text>
  <text x="260" y="150" text-anchor="middle" fill="#475569" font-size="13">page stays fast almost always</text>
  <text x="580" y="60" text-anchor="middle" fill="#334155" font-size="16" font-weight="700">20 calls per page</text>
  <g fill="#93c5fd" stroke="#60a5fa" stroke-width="1.5">
    <circle cx="430" cy="120" r="11"/>
    <circle cx="462" cy="106" r="11"/>
    <circle cx="498" cy="99" r="11"/>
    <circle cx="534" cy="100" r="11"/>
    <circle cx="566" cy="112" r="11"/>
    <circle cx="588" cy="130" r="11"/>
    <circle cx="596" cy="152" r="11"/>
    <circle cx="590" cy="174" r="11"/>
    <circle cx="572" cy="190" r="11"/>
    <circle cx="548" cy="198" r="11"/>
    <circle cx="520" cy="200" r="11"/>
    <circle cx="492" cy="198" r="11"/>
    <circle cx="468" cy="190" r="11"/>
    <circle cx="450" cy="176" r="11"/>
    <circle cx="438" cy="156" r="11"/>
  </g>
  <g transform="translate(680,100)">
    <circle cx="0" cy="32" r="11" fill="#fca5a5" stroke="#ef4444" stroke-width="2"/>
    <circle cx="26" cy="92" r="11" fill="#fca5a5" stroke="#ef4444" stroke-width="2"/>
    <circle cx="-4" cy="132" r="11" fill="#93c5fd" stroke="#60a5fa" stroke-width="1.5"/>
  </g>
  <text x="560" y="250" text-anchor="middle" fill="#475569" font-size="13">each call still 2% slow</text>
  <text x="560" y="272" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="700">page hits a slow call ~33% of the time</text>
  <line x1="300" y1="160" x2="410" y2="160" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="410,154 424,160 410,166" fill="#94a3b8"/>
  <text x="380" y="340" text-anchor="middle" fill="#64748b" font-size="14">The page is only as fast as its slowest parallel dependency. p95 tells the real story; the mean does not.</text>
</svg>